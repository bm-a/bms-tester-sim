name: ci
on: [push, pull_request]
jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q .
      - run: python sim_server.py --port 8008 &
      - run: for i in $(seq 1 30); do curl -sf http://127.0.0.1:8008/api/state && break || sleep 1; done
      - run: python verify_sim.py
